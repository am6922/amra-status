<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Amra Status</title>
<meta name="description" content="Live status of the Amra Consulting platform: website, CRM app, chat, forms and booking.">
<link rel="icon" href="https://amra.consulting/favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f7fb;--card:#fff;--ink:#0e1a2b;--muted:#5b6b80;--line:#e3e9f1;--up:#16a34a;--down:#dc2626;--warn:#d97706;--blue:#188bf6;--nodata:#d5dde8}
@media (prefers-color-scheme:dark){:root{--bg:#0b1220;--card:#121b2d;--ink:#e8eef7;--muted:#93a3b8;--line:#22304a;--nodata:#2a3853}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
h1,.brand,.banner,.name{font-family:Sora,Inter,sans-serif}
.wrap{max-width:820px;margin:0 auto;padding:32px 16px 48px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:24px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:20px;letter-spacing:-.01em;color:var(--ink);text-decoration:none}
.brand img{height:44px;width:auto;display:block}.brand span{font-size:15px;font-weight:600;color:var(--muted);padding-left:10px;border-left:1px solid var(--line)}
header a.site{color:var(--blue);text-decoration:none;font-weight:600;font-size:14px}
.banner{border-radius:14px;padding:18px 20px;color:#fff;font-weight:700;font-size:17px;display:flex;align-items:center;gap:10px;margin-bottom:22px}
.banner.up{background:var(--up)}.banner.down{background:var(--down)}.banner.partial{background:var(--warn)}.banner.loading{background:var(--muted)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:6px 20px}
.svc{padding:16px 0;border-bottom:1px solid var(--line)}.svc:last-child{border-bottom:0}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px}
.name{font-weight:650}.state{font-size:13px;font-weight:700;display:flex;align-items:center;gap:6px;white-space:nowrap}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block}
.bars{display:flex;gap:2px;margin:10px 0 6px;height:30px}.bar{flex:1;border-radius:2px;background:var(--nodata);min-width:2px}
.meta{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
footer{margin-top:20px;color:var(--muted);font-size:13px;text-align:center}
footer a{color:var(--blue)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <a class="brand" href="https://amra.consulting"><img src="https://amra.consulting/assets/amra-logo-badge.png" alt="Amra Consulting"><span>Status</span></a>
    <a class="site" href="https://app.amra.consulting">Sign in →</a>
  </header>
  <div id="banner" class="banner loading">Checking systems…</div>
  <div class="card" id="list"></div>
  <footer><span id="checked"></span><br>Checked automatically every 5 minutes. Need help? <a href="https://amra.consulting/contact.html">Contact us</a>.</footer>
</div>
<script>
var RAW='https://raw.githubusercontent.com/am6922/amra-status/data/';
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function ago(iso){var m=Math.round((Date.now()-new Date(iso))/60000);return m<1?'just now':m===1?'1 minute ago':m<60?m+' minutes ago':Math.round(m/60)+' hours ago'}
async function load(){
  try{
    var bust='?t='+Date.now();
    var [st,hi]=await Promise.all([fetch(RAW+'status.json'+bust).then(r=>r.json()),fetch(RAW+'history.json'+bust).then(r=>r.json()).catch(()=>({}))]);
    var stale=(Date.now()-new Date(st.checkedAt))>30*60000;
    var down=st.services.filter(s=>!s.ok).length;
    var b=document.getElementById('banner');
    if(down===0){b.className='banner up';b.textContent='✓ All systems operational'}
    else if(down===st.services.length){b.className='banner down';b.textContent='✕ Major outage — we\'re on it'}
    else{b.className='banner partial';b.textContent='! Partial outage — some services are affected'}
    var days=[];for(var i=89;i>=0;i--){days.push(new Date(Date.now()-i*864e5).toISOString().slice(0,10))}
    document.getElementById('list').innerHTML=st.services.map(function(s){
      var up=0,tot=0;
      var bars=days.map(function(d){var v=hi[d]&&hi[d][s.id];if(!v)return '<div class="bar" title="'+d+': no data"></div>';up+=v[0];tot+=v[1];var p=v[0]/v[1];var c=p>=.999?'var(--up)':p>=.95?'var(--warn)':'var(--down)';return '<div class="bar" style="background:'+c+'" title="'+d+': '+(p*100).toFixed(2)+'% up"></div>'}).join('');
      var pct=tot?(up/tot*100).toFixed(2)+'% uptime':'Collecting data';
      return '<div class="svc"><div class="row"><span class="name">'+esc(s.name)+'</span><span class="state" style="color:'+(s.ok?'var(--up)':'var(--down)')+'"><span class="dot" style="background:'+(s.ok?'var(--up)':'var(--down)')+'"></span>'+(s.ok?'Operational':'Down')+'</span></div><div class="bars">'+bars+'</div><div class="meta"><span>90 days ago</span><span>'+pct+(s.ok?' · '+s.ms+' ms':'')+'</span><span>Today</span></div></div>';
    }).join('');
    document.getElementById('checked').textContent='Last checked '+ago(st.checkedAt)+(stale?' (monitor delayed)':'')+'.';
  }catch(e){var b=document.getElementById('banner');b.className='banner loading';b.textContent='Status data is loading — check back in a minute.'}
}
load();setInterval(load,60000);
</script>
</body>
</html>
